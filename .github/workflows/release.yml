name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release without it would be debug-signed and could not be installed as an upgrade."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APKs
        env:
          NHNK_KEYSTORE: ${{ runner.temp }}/release.jks
          NHNK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NHNK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NHNK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The github flavor keeps the in-app updater; the playstore flavor is uploaded to Play separately.
        run: flutter build apk --release --split-per-abi --flavor github --dart-define=NHNK_DISTRIBUTION=github

      - name: Verify the APKs are not debug-signed
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $apk"
            if "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is debug-signed"
              exit 1
            fi
          done

      - name: Stage assets
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/*-github-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-github-release\.apk$/\1/')
            cp "$apk" "dist/NHNK-${VERSION}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "NHNK $GITHUB_REF_NAME" --generate-notes
