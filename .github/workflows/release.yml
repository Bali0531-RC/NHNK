name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    # Unsigned on purpose: signing needs a paid Apple Developer account, so users
    # sideload and sign with their own Apple ID. Never blocks the Android release.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      # Pinned rather than tracking stable: 3.47 raised the minimum Gradle and AGP
      # versions, so a release would break on its own whenever Flutter shipped,
      # with no change on our side. Bump this deliberately after testing locally.
      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          version: 3.47.7

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign --dart-define=NHNK_DISTRIBUTION=github

      - name: Package as unsigned ipa
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          (cd dist && zip -qry "NHNK-${VERSION}-unsigned.ipa" Payload && rm -rf Payload)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: dist/*.ipa
          if-no-files-found: error

      - name: Check if Apple App Store signing is configured
        id: apple_signing
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [ -n "$IOS_TEAM_ID" ] && [ "$IOS_TEAM_ID" != "TODO" ] && [ -n "$IOS_DIST_CERT_BASE64" ] && [ "$IOS_DIST_CERT_BASE64" != "TODO" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ] && [ "$IOS_PROVISION_PROFILE_BASE64" != "TODO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets are not set; skipping signed App Store .ipa build."
          fi

      - name: Build and sign App Store .ipa
        if: steps.apple_signing.outputs.enabled == 'true'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$PROFILE_PLIST")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${IOS_TEAM_ID}</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>hu.bali0531.nhnk.app</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = ${IOS_TEAM_ID}; PROVISIONING_PROFILE_SPECIFIER = \"${PROFILE_NAME}\"; CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" ios/Runner.xcodeproj/project.pbxproj

          flutter build ipa --release --dart-define=NHNK_DISTRIBUTION=appstore --export-options-plist="$EXPORT_PLIST"
          ls -lh build/ios/ipa/*.ipa

      - name: Upload signed .ipa to App Store Connect / TestFlight
        if: steps.apple_signing.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/')
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPSTORE_API_KEY_ID" ] || [ "$APPSTORE_API_KEY_ID" = "TODO" ] || [ -z "$APPSTORE_ISSUER_ID" ] || [ "$APPSTORE_ISSUER_ID" = "TODO" ] || [ -z "$APPSTORE_API_PRIVATE_KEY" ] || [ "$APPSTORE_API_PRIVATE_KEY" = "TODO" ]; then
            echo "::notice::App Store Connect API key secrets are not set; skipping TestFlight upload."
            exit 0
          fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf "%s" "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          IPA_FILE=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

  release:
    runs-on: ubuntu-latest
    needs: [ios]
    # workflow_dispatch is for exercising the iOS job; only a tag should publish.
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4
        # Full history and tags, so the notes can be derived from the previous tag.
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          version: 3.47.7

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release without it would be debug-signed and could not be installed as an upgrade."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed artifacts
        env:
          NHNK_KEYSTORE: ${{ runner.temp }}/release.jks
          NHNK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NHNK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NHNK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The github flavor keeps the in-app updater. The playstore flavor drops it and ships as
        # an .aab, the only format Play accepts for new apps.
        run: |
          flutter build apk --release --split-per-abi --flavor github --dart-define=NHNK_DISTRIBUTION=github
          flutter build apk --release --flavor github --dart-define=NHNK_DISTRIBUTION=github
          flutter build appbundle --release --flavor playstore --dart-define=NHNK_DISTRIBUTION=playstore

      - name: Verify nothing is debug-signed
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "== $apk"
            if "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is debug-signed"
              exit 1
            fi
          done
          for aab in build/app/outputs/bundle/playstoreRelease/*.aab; do
            echo "== $aab"
            if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
              echo "::error::$aab is debug-signed"
              exit 1
            fi
          done

      - name: Verify the Play build drops the sideload permission
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if ! "$BUILD_TOOLS/aapt2" dump permissions build/app/outputs/flutter-apk/app-github-release.apk | grep -q REQUEST_INSTALL_PACKAGES; then
            echo "::error::github build is missing REQUEST_INSTALL_PACKAGES, the in-app updater would silently fail"
            exit 1
          fi
          unzip -p build/app/outputs/bundle/playstoreRelease/*.aab base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/play-manifest.bin"
          if grep -qa REQUEST_INSTALL_PACKAGES "$RUNNER_TEMP/play-manifest.bin"; then
            echo "::error::playstore build still declares REQUEST_INSTALL_PACKAGES, Play will reject it"
            exit 1
          fi

      - name: Fetch the unsigned ipa
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ios-unsigned-ipa
          path: ios-artifact

      - name: Stage assets
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK_DIR=build/app/outputs/flutter-apk
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "$APK_DIR/app-${abi}-github-release.apk" "dist/NHNK-${VERSION}-${abi}.apk"
          done
          cp "$APK_DIR/app-github-release.apk" "dist/NHNK-${VERSION}-universal.apk"
          cp build/app/outputs/bundle/playstoreRelease/*.aab "dist/NHNK-${VERSION}-playstore.aab"
          # The ipa is optional: the iOS job is allowed to fail without holding up Android.
          cp ios-artifact/*.ipa dist/ 2>/dev/null || echo "no ipa produced, continuing"
          # Listing explicitly: a bare glob would include the checksum file the shell
          # has already created by the time sha256sum runs.
          (cd dist && sha256sum $(ls | grep -E '\.(apk|aab|ipa)$') > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # --generate-notes was silently producing nothing next to --notes-file, so every
        # release shipped the same install instructions with no word on what changed.
        # A hand written .github/release-notes/<tag>.md wins; otherwise the commit
        # subjects since the previous tag are used so a release is never left empty.
        run: |
          NOTES_FILE="$RUNNER_TEMP/notes.md"
          CUSTOM=".github/release-notes/${GITHUB_REF_NAME}.md"

          if [ -f "$CUSTOM" ]; then
            cat "$CUSTOM" > "$NOTES_FILE"
          else
            PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            {
              echo "## Mi változott"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --format='- %s' "$PREV..${GITHUB_REF_NAME}"
              else
                git log --no-merges --format='- %s' -1 "${GITHUB_REF_NAME}"
              fi
            } > "$NOTES_FILE"
          fi

          printf '\n---\n\n' >> "$NOTES_FILE"
          cat .github/release-body.md >> "$NOTES_FILE"

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NHNK $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "NHNK $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Prepare Google Play release notes
        id: play_notes
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_STORE_SERVICE_ACCOUNT_JSON is not set; skipping automatic Google Play upload."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          CUSTOM=".github/release-notes/${GITHUB_REF_NAME}.md"
          python3 - "$CUSTOM" "$RUNNER_TEMP/whatsnew" "${GITHUB_REF_NAME}" <<'PY'
          import os, re, sys
          custom_path, out_dir, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(custom_path, encoding="utf-8").read() if os.path.exists(custom_path) else ""
          for locale, fallback in [
              ("hu-HU", f"NHNK {tag} hibajavítások és fejlesztések."),
              ("en-US", f"NHNK {tag} bug fixes and improvements."),
          ]:
              m = re.search(rf"<{locale}>\s*(.*?)\s*</{locale}>", text, re.DOTALL)
              body = (m.group(1).strip() if m else fallback)[:495]
              with open(os.path.join(out_dir, f"whatsnew-{locale}"), "w", encoding="utf-8") as f:
                  f.write(body)
          PY

      - name: Upload to Google Play Production
        if: steps.play_notes.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: hu.bali0531.nhnk.app
          releaseFiles: dist/NHNK-*-playstore.aab
          track: production
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
