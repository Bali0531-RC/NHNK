import java.util.Properties
import java.io.FileInputStream

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Signing credentials come from key.properties locally, or from the environment in CI.
def releaseStoreFile = System.getenv('NEPTUN_KEYSTORE') ?: keystoreProperties['storeFile']
def releaseStorePassword = System.getenv('NEPTUN_KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
def releaseKeyAlias = System.getenv('NEPTUN_KEY_ALIAS') ?: keystoreProperties['keyAlias']
def releaseKeyPassword = System.getenv('NEPTUN_KEY_PASSWORD') ?: keystoreProperties['keyPassword']
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

if (!hasReleaseSigning) {
    logger.warn("WARNING: no release signing key found; release builds fall back to the debug key " +
                "and cannot be installed as an upgrade. See android/key.properties.example.")
}

android {
    namespace "com.zoligamer.neptun_mobile.app"
    compileSdkVersion 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.zoligamer.neptun_mobile.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        setProperty("archivesBaseName", "Neptun_Mobile")
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
            }
        }
        debug {

        }
    }
    buildTypes {
        release {
            // Falls back to debug signing so a fresh clone without a keystore still builds.
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            // Set NEPTUN_NO_SHRINK=1 to build an unshrunk release when diagnosing R8 stripping.
            if (System.getenv('NEPTUN_NO_SHRINK')) {
                minifyEnabled false
                shrinkResources false
            } else {
                minifyEnabled true
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // Csak a release buildeket nevezzük át
            if (variant.buildType.name == "release") {
                // Megnézzük, melyik ABI (architektúra) épp a soros
                def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
                def customName = ""

                if (abiFilter == "armeabi-v7a") {
                    customName = "Neptun_Mobile_ARM7.apk"
                } else if (abiFilter == "arm64-v8a") {
                    customName = "Neptun_Mobile_ARM8.apk"
                } else if (abiFilter == "x86_64") {
                    customName = "Neptun_Mobile_x86_64.apk" // Ha esetleg ezt is buildelnéd
                } else {
                    // Fallback, ha valami más jönne ki (pl. universal apk)
                    customName = "Neptun_Mobile_Universal.apk"
                }

                // Csak akkor nevezzük át, ha meg tudtuk határozni az ABI-t
                if (abiFilter != null) {
                    outputFileName = customName
                }
            }
        }
    }

}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'androidx.window:window:1.0.0'
    implementation 'androidx.window:window-java:1.0.0'
}

flutter {
    source '../..'
}
